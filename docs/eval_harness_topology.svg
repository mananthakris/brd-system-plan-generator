<svg width="100%" viewBox="0 0 720 848" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>BRD Engineering Plan: Offline Eval Harness topology</title>
  <desc>Eval harness flow: 4 golden fraud-domain BRDs → run_golden_brds.py (full pipeline + Phoenix tracing, writes golden_brd_run.json) → two parallel eval paths: run_structural_checks.py (deterministic schema and field checks per agent) and run_phoenix_evals.py (14 LLM-as-Judge rubrics via gpt-4o-mini) → both score 6 agents → results: structural_check_results.json and Phoenix UI at localhost:6006 → improvement loop: edit agent prompt, rerun.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== SECTION 1: Eval Dataset ===== -->
  <rect x="20" y="20" width="680" height="116" rx="8" fill="none" stroke="rgba(222,220,209,0.3)" stroke-width="0.5" stroke-dasharray="6 3"/>
  <text x="38" y="36" text-anchor="start" fill="rgb(194,192,182)" font-size="12" font-family="system-ui, sans-serif">Eval dataset · 4 golden BRDs (fraud domain)</text>

  <!-- BRD 1 -->
  <rect x="30" y="48" width="155" height="74" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
  <text x="107" y="72" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-size="12" font-weight="500" font-family="system-ui, sans-serif">Adverse Action</text>
  <text x="107" y="89" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-size="11" font-family="system-ui, sans-serif">Reason Codes</text>
  <text x="107" y="108" text-anchor="middle" dominant-baseline="central" fill="rgb(156,154,146)" font-size="10" font-family="system-ui, sans-serif">brd_adverse_action...</text>

  <!-- BRD 2 -->
  <rect x="197" y="48" width="155" height="74" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
  <text x="274" y="72" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-size="12" font-weight="500" font-family="system-ui, sans-serif">App Fraud</text>
  <text x="274" y="89" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-size="11" font-family="system-ui, sans-serif">Scoring</text>
  <text x="274" y="108" text-anchor="middle" dominant-baseline="central" fill="rgb(156,154,146)" font-size="10" font-family="system-ui, sans-serif">brd_application_fraud...</text>

  <!-- BRD 3 -->
  <rect x="364" y="48" width="155" height="74" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
  <text x="441" y="72" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-size="12" font-weight="500" font-family="system-ui, sans-serif">First-Party Fraud</text>
  <text x="441" y="89" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-size="11" font-family="system-ui, sans-serif">Case Management</text>
  <text x="441" y="108" text-anchor="middle" dominant-baseline="central" fill="rgb(156,154,146)" font-size="10" font-family="system-ui, sans-serif">brd_first_party_fraud...</text>

  <!-- BRD 4 -->
  <rect x="531" y="48" width="157" height="74" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
  <text x="609" y="72" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-size="12" font-weight="500" font-family="system-ui, sans-serif">Synthetic Identity</text>
  <text x="609" y="89" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-size="11" font-family="system-ui, sans-serif">Detection</text>
  <text x="609" y="108" text-anchor="middle" dominant-baseline="central" fill="rgb(156,154,146)" font-size="10" font-family="system-ui, sans-serif">brd_synthetic_identity...</text>

  <!-- Arrow: dataset → step 1 -->
  <line x1="360" y1="136" x2="360" y2="160" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== SECTION 2: Step 1 — Full Pipeline Runner ===== -->
  <rect x="80" y="160" width="560" height="62" rx="8" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="0.5"/>
  <text x="360" y="180" text-anchor="middle" dominant-baseline="central" fill="rgb(181,212,244)" font-size="14" font-weight="500" font-family="system-ui, sans-serif">Step 1 · run_golden_brds.py</text>
  <text x="360" y="200" text-anchor="middle" dominant-baseline="central" fill="rgb(133,183,235)" font-size="12" font-family="system-ui, sans-serif">Full pipeline · Phoenix tracing · writes evals/results/golden_brd_run.json</text>

  <!-- Fan: step 1 → two evaluators -->
  <line x1="360" y1="222" x2="360" y2="246" stroke="rgb(156,154,146)" stroke-width="1.5"/>
  <line x1="360" y1="246" x2="192" y2="246" stroke="rgb(156,154,146)" stroke-width="1.5"/>
  <line x1="192" y1="246" x2="192" y2="265" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="246" x2="530" y2="246" stroke="rgb(156,154,146)" stroke-width="1.5"/>
  <line x1="530" y1="246" x2="530" y2="265" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== SECTION 3: Two Evaluator Paths ===== -->
  <!-- Left: Structural -->
  <rect x="22" y="265" width="332" height="80" rx="8" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
  <text x="188" y="285" text-anchor="middle" dominant-baseline="central" fill="rgb(245,196,179)" font-size="13" font-weight="500" font-family="system-ui, sans-serif">Step 2a · run_structural_checks.py</text>
  <text x="188" y="304" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)" font-size="12" font-family="system-ui, sans-serif">Deterministic · per-agent isolation · no LLM calls</text>
  <text x="188" y="323" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)" font-size="11" font-family="system-ui, sans-serif">Schema · field presence · count assertions</text>

  <!-- Right: Phoenix/LLM -->
  <rect x="366" y="265" width="332" height="80" rx="8" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
  <text x="532" y="285" text-anchor="middle" dominant-baseline="central" fill="rgb(245,196,179)" font-size="13" font-weight="500" font-family="system-ui, sans-serif">Step 2b · run_phoenix_evals.py</text>
  <text x="532" y="304" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)" font-size="12" font-family="system-ui, sans-serif">LLM-as-Judge · reads Phoenix spans</text>
  <text x="532" y="323" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)" font-size="11" font-family="system-ui, sans-serif">gpt-4o-mini · 14 rubrics · score 0–1 per span</text>

  <!-- Arrows from both paths down toward agents container -->
  <line x1="188" y1="345" x2="188" y2="368" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="532" y1="345" x2="532" y2="368" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Dashed merge line at y=358 -->
  <line x1="188" y1="358" x2="532" y2="358" stroke="rgb(156,154,146)" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- ===== SECTION 4: 6 Agents Under Test ===== -->
  <rect x="20" y="368" width="680" height="86" rx="8" fill="none" stroke="rgba(222,220,209,0.3)" stroke-width="0.5" stroke-dasharray="6 3"/>
  <text x="38" y="384" text-anchor="start" fill="rgb(194,192,182)" font-size="12" font-family="system-ui, sans-serif">6 agents under test</text>

  <!-- plan_generator -->
  <rect x="30" y="394" width="103" height="48" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text x="81" y="412" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-size="11" font-weight="500" font-family="system-ui, sans-serif">plan</text>
  <text x="81" y="429" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-size="10" font-family="system-ui, sans-serif">generator</text>

  <!-- schedule_estimator -->
  <rect x="139" y="394" width="103" height="48" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text x="190" y="412" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-size="11" font-weight="500" font-family="system-ui, sans-serif">schedule</text>
  <text x="190" y="429" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-size="10" font-family="system-ui, sans-serif">estimator</text>

  <!-- solution_architect -->
  <rect x="248" y="394" width="103" height="48" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text x="299" y="412" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-size="11" font-weight="500" font-family="system-ui, sans-serif">solution</text>
  <text x="299" y="429" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-size="10" font-family="system-ui, sans-serif">architect</text>

  <!-- tech_stack_recommender -->
  <rect x="357" y="394" width="103" height="48" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text x="408" y="412" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-size="11" font-weight="500" font-family="system-ui, sans-serif">tech stack</text>
  <text x="408" y="429" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-size="10" font-family="system-ui, sans-serif">recommender</text>

  <!-- critic -->
  <rect x="466" y="394" width="103" height="48" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text x="517" y="412" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-size="11" font-weight="500" font-family="system-ui, sans-serif">critic</text>
  <text x="517" y="429" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-size="10" font-family="system-ui, sans-serif">agent</text>

  <!-- output_formatter -->
  <rect x="575" y="394" width="113" height="48" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text x="631" y="412" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-size="11" font-weight="500" font-family="system-ui, sans-serif">output</text>
  <text x="631" y="429" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-size="10" font-family="system-ui, sans-serif">formatter</text>

  <!-- Arrow: agents → eval dimensions -->
  <line x1="360" y1="454" x2="360" y2="477" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== SECTION 5: Eval Dimensions (two panels) ===== -->
  <!-- Left: Structural checks -->
  <rect x="20" y="477" width="335" height="152" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
  <text x="187" y="496" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-size="13" font-weight="500" font-family="system-ui, sans-serif">Structural checks · deterministic</text>
  <text x="187" y="515" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">plan_gen: phase_count_in_range · deliverables</text>
  <text x="187" y="532" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">schedule: duration_set · risk_entries · assumptions</text>
  <text x="187" y="549" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">architect: 2–3 options · unique IDs · problem_type</text>
  <text x="187" y="566" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">tech_stack: options_present · recommended_set</text>
  <text x="187" y="583" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">critic: 5 dimensions · scores_in_range · revision_notes</text>
  <text x="187" y="600" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">formatter: exec_summary · sections_complete · schema</text>
  <text x="187" y="618" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-size="10" font-family="system-ui, sans-serif">writes: evals/results/structural_check_results.json</text>

  <!-- Right: LLM-as-Judge -->
  <rect x="365" y="477" width="335" height="152" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
  <text x="532" y="496" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-size="13" font-weight="500" font-family="system-ui, sans-serif">LLM-as-Judge · 14 evaluators</text>
  <text x="532" y="515" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">plan: brd_coverage · phase_coherence · scope_respect</text>
  <text x="532" y="532" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">schedule: risk_mitigation · assumption_specificity</text>
  <text x="532" y="549" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">architect: classification · diff_options · rag_grounding</text>
  <text x="532" y="566" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">tech_stack: stack_preference · constraint_respect</text>
  <text x="532" y="583" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">critic: feedback_specificity · revision_actionability</text>
  <text x="532" y="600" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-size="11" font-family="system-ui, sans-serif">formatter: business_clarity · technical_accuracy</text>
  <text x="532" y="618" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-size="10" font-family="system-ui, sans-serif">logs scores to Phoenix spans · prints summary table</text>

  <!-- Arrow: dimensions → results -->
  <line x1="360" y1="629" x2="360" y2="653" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== SECTION 6: Results and Reports ===== -->
  <rect x="20" y="653" width="680" height="118" rx="8" fill="rgb(39,80,10)" stroke="rgb(151,196,89)" stroke-width="0.5"/>
  <text x="360" y="672" text-anchor="middle" dominant-baseline="central" fill="rgb(192,221,151)" font-size="14" font-weight="500" font-family="system-ui, sans-serif">Results &amp; reports</text>

  <!-- Left result -->
  <rect x="35" y="686" width="290" height="72" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
  <text x="180" y="704" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-size="12" font-weight="500" font-family="system-ui, sans-serif">Structural · evals/results/</text>
  <text x="180" y="721" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-size="11" font-family="system-ui, sans-serif">structural_check_results.json</text>
  <text x="180" y="738" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-size="11" font-family="system-ui, sans-serif">Rich table: agent · check · ✓/✗ · evidence</text>
  <text x="180" y="752" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-size="10" font-family="system-ui, sans-serif">Pass rate: green ≥ 80% · amber ≥ 60% · red</text>

  <!-- Right result -->
  <rect x="395" y="686" width="290" height="72" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
  <text x="540" y="704" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-size="12" font-weight="500" font-family="system-ui, sans-serif">Phoenix UI · localhost:6006</text>
  <text x="540" y="721" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-size="11" font-family="system-ui, sans-serif">Per-span judge scores · avg + pass rate</text>
  <text x="540" y="738" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-size="11" font-family="system-ui, sans-serif">Filter by agent.name → failing spans</text>
  <text x="540" y="752" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-size="10" font-family="system-ui, sans-serif">Click span → input/output + judge explanation</text>

  <!-- ===== Improvement Loop (Flywheel) ===== -->
  <path d="M700 712 L700 191 L640 191" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="695" y="455" text-anchor="end" fill="rgb(194,192,182)" font-size="11" font-family="system-ui, sans-serif" transform="rotate(-90 695 455)">improvement loop</text>

  <!-- Improvement loop label box -->
  <rect x="20" y="785" width="680" height="46" rx="8" fill="none" stroke="rgba(222,220,209,0.2)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="360" y="803" text-anchor="middle" dominant-baseline="central" fill="rgb(194,192,182)" font-size="12" font-family="system-ui, sans-serif">Improvement loop: identify failing spans in Phoenix · edit system prompt in agents/&lt;agent&gt;.py</text>
  <text x="360" y="820" text-anchor="middle" dominant-baseline="central" fill="rgb(156,154,146)" font-size="11" font-family="system-ui, sans-serif">rerun: python -m evals.run_golden_brds &amp;&amp; python -m evals.run_structural_checks &amp;&amp; python -m evals.run_phoenix_evals</text>
